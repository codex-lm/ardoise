<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ardoise</title>
  <meta name="description" content="Ardoise — Conway's Game of Life on a school blackboard: twelve chalk challenges and a free pattern sandbox, in English, French and Spanish.">
  <style>
/* ARDOISE — tableau d'école : ardoise verte, craie blanche/jaune, bois.
   Palette centralisée (audit artDirection). */
:root {
  --ardoise: #2f4a3f;        /* fond tableau */
  --ardoise-clair: #3a5a4c;  /* reliefs */
  --ardoise-fonce: #24382f;  /* creux */
  --craie: #f2f0e4;          /* craie blanche */
  --craie-jaune: #e8d44d;    /* craie jaune (accent unique) */
  --craie-doux: rgba(242, 240, 228, 0.72);
  --traie: rgba(242, 240, 228, 0.16);
  --mur: #d9d0ba;            /* mur de classe */
  --mur-fonce: #c9bfa6;
  --bois: #8a6b4a;           /* cadre + bac à craie */
  --bois-fonce: #6d5338;
  --ombre: rgba(30, 40, 34, 0.35);
  --main: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--main);
  color: var(--craie);
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255, 252, 240, 0.5), rgba(255, 252, 240, 0) 60%),
    linear-gradient(160deg, var(--mur) 0%, var(--mur-fonce) 100%);
  min-height: 100vh;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}

#app { max-width: 1080px; margin: 0 auto; padding: 10px 12px 18px; }

/* ---------- entête ---------- */
header#top {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; padding: 6px 2px 10px;
}
.brand h1 {
  margin: 0; font-size: clamp(30px, 6vw, 46px); letter-spacing: 4px;
  color: var(--craie);
  text-shadow: 0 2px 0 var(--ardoise-fonce), 0 0 14px rgba(242, 240, 228, 0.25);
}
.brand h1 .lt { display: inline-block; }
.brand p { margin: 2px 0 0; color: var(--ardoise-fonce); font-size: 14px; }
.topctl { display: flex; gap: 8px; align-items: center; }

/* ---------- boutons craie ---------- */
button {
  font-family: var(--main); font-size: 16px; color: var(--craie);
  background: rgba(47, 74, 63, 0.25);
  border: 2.5px solid var(--ardoise);
  border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  padding: 8px 16px; cursor: pointer; min-height: 44px;
  transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease;
}
button:hover { background: rgba(47, 74, 63, 0.45); }
button:active { transform: translateY(2px) scale(0.98); }
button.primary {
  background: var(--ardoise); color: var(--craie);
  box-shadow: 3px 4px 0 var(--ombre);
  font-size: 19px; padding: 12px 26px;
}
button.big { font-size: 19px; padding: 12px 24px; }
button.ghost { border-color: var(--ardoise); background: transparent; min-height: 40px; padding: 6px 12px; }
button.small { font-size: 14px; min-height: 38px; padding: 6px 12px; }
button:disabled { opacity: 0.4; cursor: default; }
button.on { background: var(--ardoise); color: var(--craie-jaune); }
button:focus-visible { outline: 3px dashed var(--ardoise); outline-offset: 2px; }

/* langues */
.langs { display: flex; gap: 6px; }

/* ---------- écrans ---------- */
.screen.hidden, .hidden { display: none !important; }
.subtitle { color: var(--ardoise-fonce); font-size: clamp(15px, 2.6vw, 19px); max-width: 640px; }
#home .homebtns { display: flex; gap: 14px; flex-wrap: wrap; margin: 18px 0 8px; }
#home .homebtns button { color: var(--ardoise-fonce); border-color: var(--ardoise-fonce); }
#home .homebtns button.primary { color: var(--craie); }
.keys { color: var(--ardoise-fonce); font-size: 13px; margin: 10px 0 0; }

/* grille de niveaux */
.levelgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
.lvl {
  border: 2.5px solid var(--ardoise); border-radius: 18px 6px 16px 8px / 8px 16px 6px 18px;
  background: rgba(47, 74, 63, 0.92); color: var(--craie);
  padding: 10px 12px; cursor: pointer; text-align: left; min-height: 86px;
  display: flex; flex-direction: column; gap: 4px; justify-content: space-between;
  font-size: 15px;
}
.lvl:hover { background: var(--ardoise); }
.lvl .nm { font-size: 16px; }
.lvl .tp { color: var(--craie-doux); font-size: 12.5px; font-family: var(--mono); }
.lvl .st { color: var(--craie-jaune); letter-spacing: 2px; font-size: 15px; }
.lvl.locked { opacity: 0.45; cursor: default; }
.lvl.locked:hover { background: rgba(47, 74, 63, 0.92); }
.lvl .lk { font-size: 12.5px; color: var(--craie-doux); }

/* ---------- plateau ---------- */
#board-frame {
  background: linear-gradient(180deg, var(--bois) 0%, var(--bois-fonce) 100%);
  border-radius: 14px; padding: 12px;
  box-shadow: 0 14px 34px var(--ombre), inset 0 2px 3px rgba(255, 255, 255, 0.25);
  margin: 8px 0 4px;
}
#board-wrap { position: relative; border-radius: 6px; overflow: hidden; }
#board { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
#zone-flash { position: absolute; inset: 0; pointer-events: none; }

/* HUD */
.hud { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 10px; }
.hud-mid { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip {
  font-family: var(--mono); font-size: 13.5px; color: var(--ardoise-fonce);
  border: 2px solid var(--ardoise-fonce); border-radius: 12px 4px 10px 5px / 5px 10px 4px 12px;
  padding: 4px 10px; background: rgba(255, 252, 240, 0.35);
}
.chip b { color: var(--ardoise-fonce); }
.chip.bell { color: #7a5a10; border-color: #a8871e; background: rgba(232, 212, 77, 0.35); }
.goalbar { margin: 8px 0 0; font-size: 15.5px; color: var(--ardoise-fonce); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.goalbar .tp { font-size: 13px; padding: 3px 10px; }
.sparkline { image-rendering: pixelated; vertical-align: middle; }

/* bac à craie (contrôles) */
.tray {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: linear-gradient(180deg, #9a7a55 0%, var(--bois) 100%);
  border-radius: 10px; padding: 9px 12px; margin-top: 10px;
  box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.28), 0 4px 10px var(--ombre);
}
.tray button { border-color: var(--bois-fonce); color: #2e2318; background: rgba(242, 240, 228, 0.85); }
.tray button:hover { background: var(--craie); }
.tray button.on { background: #2e2318; color: var(--craie); }
.tray .sep { width: 2px; align-self: stretch; background: rgba(46, 35, 24, 0.35); border-radius: 2px; }
.tray .spacer { flex: 1; }
.tray label { font-family: var(--mono); font-size: 12.5px; color: #efe9d8; }

/* boutons Craie / Éponge en forme */
.btn-chalk { position: relative; padding-left: 40px !important; }
.btn-chalk::before {
  content: ""; position: absolute; left: 10px; top: 50%; transform: translateY(-50%) rotate(-4deg);
  width: 20px; height: 9px; border-radius: 3px; background: linear-gradient(180deg, #fdfcf6, #d8d4c4);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
}
.btn-sponge { position: relative; padding-left: 40px !important; }
.btn-sponge::before {
  content: ""; position: absolute; left: 10px; top: 50%; transform: translateY(-50%) rotate(3deg);
  width: 20px; height: 12px; border-radius: 4px;
  background:
    radial-gradient(circle at 30% 40%, rgba(120, 90, 30, 0.5) 1px, transparent 2px),
    radial-gradient(circle at 65% 60%, rgba(120, 90, 30, 0.5) 1px, transparent 2px),
    linear-gradient(180deg, #e9d27a, #c9a83f);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
}

/* motifs (atelier) */
.patterns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.pat {
  font-family: var(--mono); font-size: 12.5px; min-height: 36px; padding: 4px 10px;
  border-width: 2px;
}
.pat.on { background: #2e2318; color: var(--craie-jaune); }

/* ---------- superpositions ---------- */
#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
  background: var(--ardoise); color: var(--craie); font-size: 15.5px;
  border: 2px solid var(--craie-doux); border-radius: 14px 6px 12px 7px / 7px 12px 6px 14px;
  padding: 10px 18px; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
  z-index: 50; max-width: min(90vw, 480px); text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#overlay {
  position: fixed; inset: 0; background: rgba(24, 36, 30, 0.72);
  display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px;
}
#overlay-card {
  background: linear-gradient(170deg, var(--ardoise-clair) 0%, var(--ardoise) 55%, var(--ardoise-fonce) 100%);
  border: 3px solid var(--craie-doux); border-radius: 22px 8px 18px 10px / 10px 18px 8px 22px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  color: var(--craie); padding: 22px 26px; max-width: 560px; width: 100%;
  max-height: 88vh; overflow: auto;
}
#overlay-card h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: 1px; }
#overlay-card h2.chalk { color: var(--craie); }
#overlay-card p { line-height: 1.45; font-size: 15.5px; }
#overlay-card .stars { font-size: 42px; letter-spacing: 8px; color: var(--craie-jaune); margin: 8px 0; text-shadow: 0 0 18px rgba(232, 212, 77, 0.45); }
#overlay-card .stars .off { color: rgba(242, 240, 228, 0.22); text-shadow: none; }
#overlay-card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
#overlay-card .row button { border-color: var(--craie-doux); background: transparent; color: var(--craie); }
#overlay-card .row button.primary { background: var(--craie); color: var(--ardoise-fonce); box-shadow: none; }
#overlay-card ul { padding-left: 20px; line-height: 1.5; font-size: 15px; }
#overlay-card .mono { font-family: var(--mono); font-size: 13px; color: var(--craie-doux); }
#overlay-card .demo { display: block; margin: 10px auto; border: 2px solid var(--traie); border-radius: 8px; background: var(--ardoise-fonce); }

/* victoire : étoiles animées */
@keyframes popstar { 0% { transform: scale(0.2) rotate(-25deg); opacity: 0; } 70% { transform: scale(1.25) rotate(6deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
#overlay-card .stars span { display: inline-block; animation: popstar 0.5s ease both; }
#overlay-card .stars span:nth-child(2) { animation-delay: 0.16s; }
#overlay-card .stars span:nth-child(3) { animation-delay: 0.32s; }

footer { margin-top: 14px; color: var(--ardoise-fonce); font-size: 12.5px; text-align: center; }

/* petits écrans */
@media (max-width: 640px) {
  #app { padding: 8px 8px 14px; }
  .brand h1 { letter-spacing: 2px; }
  .tray { padding: 7px 8px; gap: 6px; }
  .tray button { font-size: 14px; padding: 6px 10px; }
  #overlay-card { padding: 16px; }
  .levelgrid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
}

</style>
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand">
        <h1 id="title">ARDOISE</h1>
        <p id="tagline"></p>
      </div>
      <div class="topctl">
        <div id="langs" class="langs" role="group" aria-label="Language"></div>
        <button id="btn-sound" class="ghost" aria-label="Sound"></button>
      </div>
    </header>

    <main>
      <!-- Accueil -->
      <section id="home" class="screen">
        <p class="subtitle" data-i18n="subtitle"></p>
        <div class="homebtns">
          <button id="btn-play" class="primary big"></button>
          <button id="btn-sandbox" class="big"></button>
          <button id="btn-howto" class="big"></button>
        </div>
        <div id="levelgrid" class="levelgrid"></div>
        <p class="keys" data-i18n="touchHint"></p>
      </section>

      <!-- Jeu (défi ou atelier) -->
      <section id="game" class="screen hidden">
        <div class="hud">
          <button id="btn-menu" class="small"></button>
          <div class="hud-mid">
            <span id="chip-level" class="chip"></span>
            <span id="chip-type" class="chip"></span>
            <span id="chip-gen" class="chip"></span>
            <span id="chip-bell" class="chip bell"></span>
            <span id="chip-pop" class="chip"></span>
            <span id="chip-budget" class="chip"></span>
            <span id="chip-status" class="chip"></span>
          </div>
          <span style="flex:1"></span>
          <canvas id="spark" class="sparkline" width="140" height="34" aria-hidden="true"></canvas>
        </div>

        <div id="board-frame">
          <div id="board-wrap">
            <canvas id="board" aria-label="Ardoise"></canvas>
          </div>
        </div>

        <div class="goalbar">
          <span class="chip tp" id="goal-label"></span>
          <span id="goal-text"></span>
        </div>
        <div class="goalbar" id="goal-stars" style="font-size:13px"></div>

        <div id="tray-challenge" class="tray">
          <button id="btn-draw" class="btn-chalk small"></button>
          <button id="btn-erase" class="btn-sponge small"></button>
          <span class="sep"></span>
          <button id="btn-run" class="small"></button>
          <button id="btn-step" class="small"></button>
          <button id="btn-restart" class="small"></button>
          <span class="spacer"></span>
          <button id="btn-hint" class="small"></button>
        </div>

        <div id="tray-sandbox" class="tray hidden">
          <button id="sb-draw" class="btn-chalk small"></button>
          <button id="sb-erase" class="btn-sponge small"></button>
          <button id="sb-pan" class="small"></button>
          <span class="sep"></span>
          <button id="sb-run" class="small"></button>
          <button id="sb-step" class="small"></button>
          <span class="sep"></span>
          <label for="sb-speed"></label>
          <input id="sb-speed" type="range" min="1" max="60" value="12" step="1" style="width:110px">
          <span id="sb-speed-val" class="chip" style="font-size:12px"></span>
          <button id="sb-center" class="small"></button>
          <button id="sb-wrap" class="small"></button>
          <button id="sb-random" class="small"></button>
          <button id="sb-clear" class="small"></button>
        </div>
        <div id="patternbar" class="patterns hidden"></div>
        <p class="keys" id="sb-hint" style="display:none"></p>
      </section>
    </main>

    <footer>
      <span data-i18n="credit"></span><br>
      <span data-i18n="homage"></span>
    </footer>
  </div>

  <div id="toast" role="status"></div>

  <div id="overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="overlay-card"></div>
  </div>

  <script>
// ARDOISE — moteur du Jeu de la vie de Conway.
// Pur (aucun DOM) : utilisé par l'interface et par les tests Node.
/* global window */
(function () {
  'use strict';

  // --- Grille ----------------------------------------------------------------
  // cells : Uint8Array (0/1), next : tampon de calcul, age : génération de
  // survie continue d'une cellule (0 à la naissance). gen : générations écoulées.
  function makeGrid(w, h, seed) {
    const g = {
      w: w, h: h,
      cells: new Uint8Array(w * h),
      next: new Uint8Array(w * h),
      age: new Uint16Array(w * h),
      gen: 0, wrap: false,
      _hashes: [], _hashSet: {}
    };
    if (seed) for (const [x, y] of seed) setCell(g, x, y, 1);
    return g;
  }

  function idx(g, x, y) { return y * g.w + x; }

  function inBounds(g, x, y) { return x >= 0 && y >= 0 && x < g.w && y < g.h; }

  function getCell(g, x, y) { return inBounds(g, x, y) ? g.cells[y * g.w + x] : 0; }

  function setCell(g, x, y, v) {
    if (!inBounds(g, x, y)) return false;
    const i = y * g.w + x;
    if (g.cells[i] === (v ? 1 : 0)) return false;
    g.cells[i] = v ? 1 : 0;
    g.age[i] = 0;
    g._hashes.length = 0; // toute édition invalide les cycles connus
    return true;
  }

  function population(g) {
    let n = 0;
    for (let i = 0; i < g.cells.length; i++) n += g.cells[i];
    return n;
  }

  // Règle B3/S23 : naissance avec 3 voisines, survie avec 2 ou 3.
  // Retourne { births, deaths } pour les effets visuels et les stats.
  function step(g) {
    const w = g.w, h = g.h, cells = g.cells, next = g.next, age = g.age, wrap = g.wrap;
    let births = 0, deaths = 0;
    for (let y = 0; y < h; y++) {
      const yUp = y > 0 ? y - 1 : (wrap ? h - 1 : -1);
      const yDn = y < h - 1 ? y + 1 : (wrap ? 0 : -1);
      const r0 = yUp * w, r1 = y * w, r2 = yDn * w;
      for (let x = 0; x < w; x++) {
        const xL = x > 0 ? x - 1 : (wrap ? w - 1 : -1);
        const xR = x < w - 1 ? x + 1 : (wrap ? 0 : -1);
        let n = 0;
        if (yUp >= 0) {
          if (xL >= 0) n += cells[r0 + xL];
          n += cells[r0 + x];
          if (xR >= 0) n += cells[r0 + xR];
        }
        if (xL >= 0) n += cells[r1 + xL];
        if (xR >= 0) n += cells[r1 + xR];
        if (yDn >= 0) {
          if (xL >= 0) n += cells[r2 + xL];
          n += cells[r2 + x];
          if (xR >= 0) n += cells[r2 + xR];
        }
        const i = r1 + x, alive = cells[i];
        const live = alive ? (n === 2 || n === 3) : (n === 3);
        next[i] = live ? 1 : 0;
        if (live) { if (!alive) births++; } else { if (alive) deaths++; }
      }
    }
    // âges : naissances à 0, survivantes +1
    for (let i = 0; i < next.length; i++) {
      if (next[i]) { age[i] = cells[i] ? Math.min(age[i] + 1, 65535) : 0; }
    }
    g.cells.set(next);
    g.gen++;
    return { births: births, deaths: deaths };
  }

  // Copie indépendante (rejouer un défi).
  function cloneGrid(g) {
    const c = makeGrid(g.w, g.h);
    c.cells.set(g.cells); c.age.set(g.age); c.gen = g.gen; c.wrap = g.wrap;
    return c;
  }

  // --- Détection de cycles (still lifes / oscillateurs) ----------------------
  function fnv(bytes) {
    let h = 0x811c9dc5;
    for (let i = 0; i < bytes.length; i++) {
      h ^= bytes[i]; h = (h * 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  // Enregistre l'état courant ; retourne la période détectée (1 = figure fixe,
  // p >= 2 = oscillateur de période p) ou 0 si aucun cycle.
  function detectCycle(g) {
    const h = fnv(g.cells);
    const key = h;
    const hs = g._hashes;
    // une naissance modifie cells : ne hash que si la population est stable ?
    // non : hash complet ; une grille qui revient identique est un vrai cycle.
    for (let i = hs.length - 1; i >= 0; i--) {
      if (hs[i].h === key) return { period: hs.length - i, atGen: g.gen };
    }
    hs.push({ h: key });
    if (hs.length > 96) hs.shift();
    return null;
  }

  // --- Bibliothèque de motifs ------------------------------------------------
  // Chaque motif : liste de [x, y] (coin haut-gauche à 0,0) + encombrement.
  const PATTERNS = {
    block: { cells: [[0, 0], [1, 0], [0, 1], [1, 1]], w: 2, h: 2, kind: 'still' },
    beehive: { cells: [[1, 0], [2, 0], [0, 1], [3, 1], [1, 2], [2, 2]], w: 4, h: 3, kind: 'still' },
    loaf: { cells: [[1, 0], [2, 0], [0, 1], [3, 1], [1, 2], [3, 2], [2, 3]], w: 4, h: 4, kind: 'still' },
    blinker: { cells: [[0, 0], [1, 0], [2, 0]], w: 3, h: 3, kind: 'osc' },
    toad: { cells: [[1, 0], [2, 0], [3, 0], [0, 1], [1, 1], [2, 1]], w: 4, h: 2, kind: 'osc' },
    beacon: { cells: [[0, 0], [1, 0], [0, 1], [3, 1], [2, 2], [3, 2]], w: 4, h: 3, kind: 'osc' },
    glider: { cells: [[1, 0], [2, 1], [0, 2], [1, 2], [2, 2]], w: 3, h: 3, kind: 'ship' },
    lwss: { cells: [[1, 0], [4, 0], [0, 1], [0, 2], [4, 2], [0, 3], [1, 3], [2, 3], [3, 3]], w: 5, h: 4, kind: 'ship' },
    pulsar: {
      cells: [[2, 0], [3, 0], [4, 0], [8, 0], [9, 0], [10, 0],
              [0, 2], [5, 2], [7, 2], [12, 2], [0, 3], [5, 3], [7, 3], [12, 3],
              [0, 4], [5, 4], [7, 4], [12, 4],
              [2, 5], [3, 5], [4, 5], [8, 5], [9, 5], [10, 5],
              [2, 7], [3, 7], [4, 7], [8, 7], [9, 7], [10, 7],
              [0, 8], [5, 8], [7, 8], [12, 8], [0, 9], [5, 9], [7, 9], [12, 9],
              [0, 10], [5, 10], [7, 10], [12, 10],
              [2, 12], [3, 12], [4, 12], [8, 12], [9, 12], [10, 12]],
      w: 13, h: 13, kind: 'osc'
    },
    pentadecathlon: {
      cells: [[1, 0], [1, 1], [1, 2], [1, 3], [0, 4], [2, 4], [1, 5], [1, 6], [1, 7], [1, 8], [1, 9], [1, 10], [1, 11]],
      w: 3, h: 12, kind: 'osc'
    },

// ARDOISE — sons doux à la WebAudio : craie, éponge, cloche, victoire.
// Aucun asset externe : tout est synthétisé. Reprise après suspension mobile.
/* global window */
(function () {
  'use strict';

  let ctx = null;
  let master = null;
  let enabled = true;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Petit bruit filtré : grain de craie (pose) ou coup d'éponge (retrait).
  function noise(dur, freq, q, gain, type) {
    const c = ensure();
    if (!c || !enabled) return;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const env = Math.pow(1 - i / len, 2.2);
      d[i] = (Math.random() * 2 - 1) * env;
    }
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = type || 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = c.createGain();
    g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  function tone(freq, dur, gain, delay, type) {
    const c = ensure();
    if (!c || !enabled) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  const API = {
    unlock: function () { ensure(); },
    get enabled() { return enabled; },
    setEnabled: function (v) { enabled = !!v; if (enabled) ensure(); },
    chalk: function () { noise(0.07, 2600, 1.1, 0.5); },
    chalkBatch: function () { noise(0.16, 2200, 0.9, 0.42); },
    sponge: function () { noise(0.12, 700, 0.7, 0.5, 'lowpass'); },
    tick: function () { tone(1250, 0.05, 0.10, 0, 'triangle'); },
    bell: function () {
      tone(1568, 1.2, 0.22, 0);        // sol 6
      tone(2349, 0.9, 0.10, 0.006);    // ré 7 (partiel)
      tone(3136, 0.5, 0.05, 0.012);
    },
    win: function () {
      tone(523, 0.16, 0.16, 0);
      tone(659, 0.16, 0.16, 0.09);
      tone(784, 0.16, 0.16, 0.18);
      tone(1047, 0.42, 0.18, 0.27);
    },
    fail: function () {
      tone(392, 0.2, 0.15, 0, 'triangle');
      tone(311, 0.34, 0.15, 0.12, 'triangle');
    },
    stamp: function () { noise(0.1, 1700, 1.4, 0.5); tone(880, 0.06, 0.08, 0, 'triangle'); }
  };

  if (typeof window !== 'undefined') window.Sfx = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})();

  <script>
// ARDOISE — interface : défis, atelier, rendu craie sur canvas, i18n.
/* global Life, Levels, I18N, Sfx */
(function () {
  'use strict';

  // ---------------------------------------------------------------- utilitaires
  const $ = function (id) { return document.getElementById(id); };
  const t = function (k, p) { return I18N.t(k, p); };
  const clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };

  const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

  const store = {
    get: function (k, d) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* privé */ } }
  };

  // ---------------------------------------------------------------- état global
  const S = {
    mode: 'home',            // home | challenge | sandbox
    levelIx: 0,              // index du défi courant
    grid: null,              // grille Life affichée
    baseSeed: null,          // semis initial du défi (cellules)
    phase: 'setup',          // setup | run | done
    running: false,
    speed: 12,               // gén./s (atelier)
    tool: 'draw',            // draw | erase
    stamp: null,             // nom du motif sélectionné (atelier)
    stampRot: 0,
    strokes: 0,              // traits de craie consommés (défi)
    hintUsed: false,
    hintUntil: 0,            // affichage de la solution de référence
    hintCells: null,
    placed: 0,               // cellules posées (croissance)
    popHist: [],             // historique population (sparkline)
    cycleInfo: null,
    lastStepAt: 0,
    bellFlash: 0,
    wipeArmed: 0,
    pinch: null                  // état du pincement en cours (atelier)
  };

  const canvas = $('board');
  const ctx = canvas.getContext('2d');
  const sparkC = $('spark');
  const sparkX = sparkC.getContext('2d');

  // géométrie : taille logique de cellule et décalages
  let cellPx = 16, dpr = 1, cssW = 0, cssH = 0, offX = 0, offY = 0;
  let bg = null;             // canvas hors écran (fond statique)
  let sprites = [];          // sprites craie [bucket][variant]
  const GHOSTS = [];
  const DUST = [];

  // Vue exploratoire (atelier) : zoom + caméra en pixels monde.
  const SB_CELL = 6;         // taille logique d'une cellule sur le grand tableau
  const VIEW = { zoom: 1, camX: 0, camY: 0, minZ: 0.35, maxZ: 8 };
  function viewActive() { return S.mode === 'sandbox' && !!S.grid; }
  function worldW() { return S.grid ? S.grid.w * cellPx : cssW; }
  function worldH() { return S.grid ? S.grid.h * cellPx : cssH; }

  function clampView() {
    const z = VIEW.zoom, w = worldW(), h = worldH();
    const visW = cssW / z, visH = cssH / z;
    const mx = Math.max(60, w * 0.12), my = Math.max(60, h * 0.12);
    VIEW.camX = clamp(VIEW.camX, -mx, Math.max(-mx, w - visW + mx));
    VIEW.camY = clamp(VIEW.camY, -my, Math.max(-my, h - visH + my));
  }

  function zoomAt(sx, sy, factor) {
    const z0 = VIEW.zoom;
    const z1 = clamp(z0 * factor, VIEW.minZ, VIEW.maxZ);
    if (z1 === z0) return;
    const wx = VIEW.camX + sx / z0, wy = VIEW.camY + sy / z0;
    VIEW.zoom = z1;
    VIEW.camX = wx - sx / z1;
    VIEW.camY = wy - sy / z1;
    clampView();
  }

  function centerView() {
    const w = worldW(), h = worldH();
    VIEW.zoom = clamp(Math.min(cssW / w, cssH / h), VIEW.minZ, 1.4);
    VIEW.camX = (w - cssW / VIEW.zoom) / 2;
    VIEW.camY = (h - cssH / VIEW.zoom) / 2;
    clampView();
  }

  // ---------------------------------------------------------------- dimensions
  function boardArea() {
    const frame = $('board-frame');
    const availW = Math.min(frame.parentElement.clientWidth, 1020) - 24 - 24;
    const availH = Math.max(240, window.innerHeight * 0.52);
    return { w: Math.max(240, availW), h: availH };
  }

  function layout() {
    if (!S.grid) return;
    const a = boardArea();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (S.mode === 'sandbox') {
      // grand tableau exploratoire : cellule logique fixe, canvas = zone visible
      cellPx = SB_CELL;
      cssW = a.w;
      cssH = a.h;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      bg = null; // l'atelier dessine sa base en vecteur, pas de fond pré-rendu
      ensureSprites(VIEW.zoom, performance.now(), true);
      buildSandboxLayers();
      clampView();
    } else {
      cellPx = clamp(Math.floor(Math.min(a.w / S.grid.w, a.h / S.grid.h)), 4, 34);
      cssW = cellPx * S.grid.w;
      cssH = cellPx * S.grid.h;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      offX = 0; offY = 0;
      ensureSprites(1, performance.now(), true);
      paintBackground();
    }
  }

  // Reconstruit les sprites si la taille ÉCRAN d'une cellule a changé
  // (palier ≥ 15 %, au plus toutes les 90 ms) : netteté constante au zoom.
  function ensureSprites(z, now, force) {
    const want = Math.max(3, Math.round(cellPx * z * dpr));
    const drift = Math.abs(want - spriteDevPx) > Math.max(1, spriteDevPx * 0.15);
    if (force || (drift && now - lastSpriteBuild > 90)) {
      makeSprites(want);
      spriteDevPx = want;
      lastSpriteBuild = now;
      if (viewActive()) buildSandboxLayers();
    }
  }

  // Couches d'atelier re-échantillonnées au zoom : grain d'ardoise en motif
  // + traces d'éponge déterministes (la grille et le cadre, eux, sont
  // redessinés en vecteur à chaque image — voir drawSandboxBase).
  function buildSandboxLayers() {
    const scale = clamp(VIEW.zoom * dpr, 0.3, 10);
    const tileW = 256;
    const c = document.createElement('canvas');
    c.width = c.height = Math.max(64, Math.min(1024, Math.round(tileW * scale)));
    const x = c.getContext('2d');
    const rnd = mulberry(20261102);
    const n = Math.round(c.width * c.height / 26 / (scale * scale));
    for (let i = 0; i < n; i++) {
      const px = rnd() * c.width, py = rnd() * c.height;
      x.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,0.024)' : 'rgba(0,0,0,0.05)';
      const s = (1 + rnd() * 1.6) / scale * (c.width / tileW);
      x.fillRect(px, py, s, s * 0.8);
    }
    slatePat = ctx.createPattern(c, 'repeat');
    // traces d'éponge : positions monde fixes, dessin vectoriel à chaque image
    const sm = [];
    const r2 = mulberry(S.grid.w * 131 + S.grid.h * 17 + 5);
    for (let i = 0; i < 9; i++) {
      sm.push({
        x: r2() * worldW(), y: r2() * worldH(),
        w: 40 + r2() * 90, h: 14 + r2() * 26
      });
    }
    smudges = sm;
  }

  // ---------------------------------------------------------------- sprites craie
  const BUCKETS = [
    { c: '#fdfcf5', a: 1.0 },   // 0 gén — craie toute neuve
    { c: '#f6f2e2', a: 0.95 },  // 1
    { c: '#efe8d0', a: 0.92 },  // 2-3
    { c: '#e9dcb2', a: 0.9 },   // 4-7
    { c: '#e8d44d', a: 0.92 }   // 8+ — craie ancienne, jaune
  ];

  function bucketOf(age) {
    if (age <= 0) return 0;
    if (age === 1) return 1;
    if (age <= 3) return 2;
    if (age <= 7) return 3;
    return 4;
  }

  // Les sprites craie sont construits à la résolution ÉCRAN effective
  // (cellule monde × zoom × dpr) : dessinés en repère monde sous la
  // transformation de vue, ils tombent 1:1 dans les pixels du canvas —
  // nets à tous les zooms. La densité du grain suit la résolution.
  let spriteDevPx = 0, lastSpriteBuild = 0, slatePat = null, smudges = [];

  function makeSprites(devPx) {
    sprites = [];
    const scale = devPx / cellPx; // pixels device par pixel monde
    for (let b = 0; b < BUCKETS.length; b++) {
      const row = [];
      for (let v = 0; v < 4; v++) {
        const c = document.createElement('canvas');
        c.width = Math.max(4, Math.round(devPx));
        c.height = c.width;
        const x = c.getContext('2d');
        x.scale(scale, scale);
        const inset = cellPx > 7 ? 1 : 0.5;
        const w = cellPx - inset * 2;
        const r = Math.min(3, w / 4);
        // grain de craie : la forme est pleine puis mordillée par des trous
        x.fillStyle = BUCKETS[b].c;
        x.globalAlpha = BUCKETS[b].a;
        x.beginPath();
        x.moveTo(inset + r, inset);
        x.arcTo(inset + w, inset, inset + w, inset + w, r);
        x.arcTo(inset + w, inset + w, inset, inset + w, r);
        x.arcTo(inset, inset + w, inset, inset, r);
        x.arcTo(inset, inset, inset + w, inset, r);
        x.closePath();
        x.fill();
        // aspérités : trous soustraits, taille ~constante À L'ÉCRAN
        x.globalCompositeOperation = 'destination-out';
        const rnd = mulberry(b * 17 + v * 101 + 7);
        const holes = Math.max(2, Math.round(devPx / 2.2));
        for (let i = 0; i < holes; i++) {
          const hx = inset + rnd() * w, hy = inset + rnd() * w;
          const hr = (0.5 + rnd() * 0.8) / scale;
          x.globalAlpha = 0.28 + rnd() * 0.3;
          x.beginPath(); x.arc(hx, hy, hr, 0, Math.PI * 2); x.fill();
        }
        x.globalCompositeOperation = 'source-over';
        x.globalAlpha = 1;
        row.push(c);
      }
      sprites.push(row);
    }
  }

  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let tt = Math.imul(a ^ (a >>> 15), 1 | a);
      tt = (tt + Math.imul(tt ^ (tt >>> 7), 61 | tt)) ^ tt;
      return ((tt ^ (tt >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------------------------------------------------------------- fond statique
  function paintBackground() {
    const wW = worldW(), wH = worldH();
    bg = document.createElement('canvas');
    bg.width = Math.round(wW * dpr);
    bg.height = Math.round(wH * dpr);
    const x = bg.getContext('2d');
    x.scale(dpr, dpr);
    // ardoise
    x.fillStyle = '#2f4a3f';
    x.fillRect(0, 0, wW, wH);
    // granulation de l'ardoise
    const rnd = mulberry(S.grid.w * 131 + S.grid.h * 17 + (S.mode === 'sandbox' ? 5 : 11));
    for (let i = 0; i < wW * wH / 26; i++) {
      const px = rnd() * wW, py = rnd() * wH;
      x.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,0.024)' : 'rgba(0,0,0,0.05)';
      x.fillRect(px, py, 1 + rnd() * 1.6, 1 + rnd() * 1.2);
    }
    // traces d'éponge (ellipse pâle)
    for (let i = 0; i < 3; i++) {
      const ex = rnd() * wW, ey = rnd() * wH;
      const ew = 40 + rnd() * 90, eh = 14 + rnd() * 26;
      const grd = x.createRadialGradient(ex, ey, 2, ex, ey, Math.max(ew, eh) / 2);
      grd.addColorStop(0, 'rgba(230,236,228,0.055)');
      grd.addColorStop(1, 'rgba(230,236,228,0)');
      x.fillStyle = grd;
      x.save(); x.translate(ex, ey); x.scale(1, eh / ew); x.translate(-ex, -ey);
      x.beginPath(); x.arc(ex, ey, ew / 2, 0, Math.PI * 2); x.fill(); x.restore();
    }
    // grille tracée main levée
    x.strokeStyle = 'rgba(242,240,228,0.11)';
    x.lineWidth = 1;
    for (let gx = 0; gx <= S.grid.w; gx++) {
      const jx = mulberry(gx * 977 + 3);
      const wob = cellPx > 8 ? 0.9 : 0.4;
      x.beginPath();
      x.moveTo(gx * cellPx + 0.5 + (jx() - 0.5) * wob, 0);
      for (let seg = 1; seg <= 4; seg++) {
        x.lineTo(gx * cellPx + 0.5 + (jx() - 0.5) * wob, wH * seg / 4);
      }
      x.stroke();
    }
    for (let gy = 0; gy <= S.grid.h; gy++) {
      const jy = mulberry(gy * 613 + 9);
      const wob = cellPx > 8 ? 0.9 : 0.4;
      x.beginPath();
      x.moveTo(0, gy * cellPx + 0.5 + (jy() - 0.5) * wob);
      for (let seg = 1; seg <= 4; seg++) {
        x.lineTo(wW * seg / 4, gy * cellPx + 0.5 + (jy() - 0.5) * wob);
      }
      x.stroke();
    }
    // cadre à la craie (double trait)
    x.strokeStyle = 'rgba(242,240,228,0.5)';
    x.lineWidth = 2;
    handRect(x, 2, 2, wW - 4, wH - 4, 31);
    x.strokeStyle = 'rgba(242,240,228,0.2)';
    x.lineWidth = 1;
    handRect(x, 6, 6, wW - 12, wH - 12, 77);
    // zone de croissance (défi growth)
    if (S.mode === 'challenge' && level() && level().type === 'growth') {
      const z = level().zone;
      x.strokeStyle = 'rgba(232,212,77,0.75)';
      x.lineWidth = 2;
      x.setLineDash([cellPx * 0.7, cellPx * 0.45]);
      handRect(x, z.x * cellPx + 2, z.y * cellPx + 2, z.w * cellPx - 4, z.h * cellPx - 4, 41);
      x.setLineDash([]);
    }
  }

  function handRect(x, a, b, w, h, seed) {
    const rnd = mulberry(seed);
    const pts = 5;
    x.beginPath();
    x.moveTo(a + (rnd() - 0.5) * 2, b + (rnd() - 0.5) * 2);
    for (let i = 1; i <= pts; i++) x.lineTo(a + w * i / pts + (rnd() - 0.5) * 2, b + (rnd() - 0.5) * 2);
    for (let i = 1; i <= pts; i++) x.lineTo(a + w + (rnd() - 0.5) * 2, b + h * i / pts + (rnd() - 0.5) * 2);
    for (let i = 1; i <= pts; i++) x.lineTo(a + w - w * i / pts + (rnd() - 0.5) * 2, b + h + (rnd() - 0.5) * 2);
    for (let i = 1; i <= pts; i++) x.lineTo(a + (rnd() - 0.5) * 2, b + h - h * i / pts + (rnd() - 0.5) * 2);
    x.closePath();
    x.stroke();
  }

  // ---------------------------------------------------------------- boucle de rendu
  let lastFrame = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!S.grid) return;
    const dt = Math.min(0.25, (now - lastFrame) / 1000 || 0);
    lastFrame = now;
    if (S.running) {
      S.acc = (S.acc || 0) + dt * (S.mode === 'sandbox' ? S.speed : CH_SPEED);
      while ((S.acc || 0) >= 1) {
        S.acc -= 1;
        doGen();
        if (!S.running) break;
      }
    }
    draw(now, dt);
  }

  // Base d'atelier dessinée en VECTEUR à chaque image : grille et cadre
  // gardent une épaisseur constante à l'écran, quel que soit le zoom.
  function drawSandboxBase(z) {
    const w = S.grid.w, h = S.grid.h, wW = worldW(), wH = worldH();
    // ardoise + grain
    ctx.fillStyle = '#2f4a3f';
    ctx.fillRect(0, 0, wW, wH);
    if (slatePat) { ctx.fillStyle = slatePat; ctx.fillRect(0, 0, wW, wH); }
    // traces d'éponge (dégradés doux, indépendants de la résolution)
    for (const s of smudges) {
      const gr = ctx.createRadialGradient(s.x, s.y, 2, s.x, s.y, Math.max(s.w, s.h) / 2);
      gr.addColorStop(0, 'rgba(230,236,228,0.055)');
      gr.addColorStop(1, 'rgba(230,236,228,0)');
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.scale(1, s.h / s.w);
      ctx.translate(-s.x, -s.y);
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // grille : seules les lignes visibles, épaisseur 1 px écran
    const vx0 = VIEW.camX, vy0 = VIEW.camY;
    const gx0 = Math.max(0, Math.floor(vx0 / cellPx) - 1);
    const gx1 = Math.min(w, Math.ceil((vx0 + cssW / z) / cellPx) + 1);
    const gy0 = Math.max(0, Math.floor(vy0 / cellPx) - 1);
    const gy1 = Math.min(h, Math.ceil((vy0 + cssH / z) / cellPx) + 1);
    ctx.strokeStyle = 'rgba(242,240,228,0.11)';
    ctx.lineWidth = 1 / z;
    const wob = cellPx > 8 ? 0.9 : 0.4;
    for (let gx = gx0; gx <= gx1; gx++) {
      const jx = mulberry(gx * 977 + 3);
      ctx.beginPath();
      ctx.moveTo(gx * cellPx + 0.5 + (jx() - 0.5) * wob, 0);
      for (let seg = 1; seg <= 4; seg++) {
        ctx.lineTo(gx * cellPx + 0.5 + (jx() - 0.5) * wob, wH * seg / 4);
      }
      ctx.stroke();
    }
    for (let gy = gy0; gy <= gy1; gy++) {
      const jy = mulberry(gy * 613 + 9);
      ctx.beginPath();
      ctx.moveTo(0, gy * cellPx + 0.5 + (jy() - 0.5) * wob);
      for (let seg = 1; seg <= 4; seg++) {
        ctx.lineTo(wW * seg / 4, gy * cellPx + 0.5 + (jy() - 0.5) * wob);
      }
      ctx.stroke();
    }
    // cadre à la craie (double trait vectoriel)
    ctx.strokeStyle = 'rgba(242,240,228,0.5)';
    ctx.lineWidth = 2 / z;
    handRect(ctx, 2, 2, wW - 4, wH - 4, 31);
    ctx.strokeStyle = 'rgba(242,240,228,0.2)';
    ctx.lineWidth = 1 / z;
    handRect(ctx, 6, 6, wW - 12, wH - 12, 77);
  }

  function draw(now, dt) {
    const g = S.grid;
    const va = viewActive();
    const z = va ? VIEW.zoom : 1;
    const wW = worldW(), wH = worldH();
    if (va) ensureSprites(z, now, false);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#24382f';
    ctx.fillRect(0, 0, cssW, cssH);
    if (va) {
      ctx.setTransform(dpr * z, 0, 0, dpr * z, -VIEW.camX * z * dpr, -VIEW.camY * z * dpr);
      drawSandboxBase(z);
    } else {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (bg) ctx.drawImage(bg, 0, 0, wW, wH);
    }
    // chemin rapide : cellules minuscules à l'écran → fillRect, pas de sprites
    const tiny = cellPx * z < 4.2;
    if (tiny) {
      ctx.fillStyle = '#f2f0e4';
      for (let y = 0; y < g.h; y++) {
        const row = y * g.w;
        for (let x = 0; x < g.w; x++) {
          if (g.cells[row + x]) ctx.fillRect(x * cellPx, y * cellPx, cellPx, cellPx);
        }
      }
    } else {
      for (let y = 0; y < g.h; y++) {
        const row = y * g.w;
        for (let x = 0; x < g.w; x++) {
          if (!g.cells[row + x]) continue;
          const b = bucketOf(g.age[row + x]);
          const v = (x * 7 + y * 13 + ((x * y) | 0)) % 4;
          ctx.drawImage(sprites[b][v], x * cellPx, y * cellPx, cellPx, cellPx);
        }
      }
    }
    // fantômes de craie (masqués en vue très éloignée)
    if (!tiny) {
      const nowMs = now;
      for (let i = GHOSTS.length - 1; i >= 0; i--) {
        const gh = GHOSTS[i];
        const age = (nowMs - gh.t0) / 900;
        if (age >= 1) { GHOSTS.splice(i, 1); continue; }
        ctx.strokeStyle = 'rgba(242,240,228,' + (0.3 * (1 - age)).toFixed(3) + ')';
        ctx.lineWidth = 1 / z;
        ctx.strokeRect(gh.x * cellPx + 1.5, gh.y * cellPx + 1.5, cellPx - 3, cellPx - 3);
      }
    }
    // poussière
    for (let i = DUST.length - 1; i >= 0; i--) {
      const p = DUST[i];
      p.life -= dt;
      if (p.life <= 0) { DUST.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 6 * dt;
      ctx.fillStyle = 'rgba(' + p.rgb + ',' + (0.5 * p.life / p.t0life).toFixed(3) + ')';
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    // indice : solution de référence
    if (S.hintCells && now < S.hintUntil) {
      ctx.save();
      ctx.strokeStyle = 'rgba(232,212,77,0.95)';
      ctx.setLineDash([4 / z, 3 / z]);
      ctx.lineWidth = 2 / z;
      for (const [hx, hy] of S.hintCells) {
        ctx.strokeRect(hx * cellPx + 1, hy * cellPx + 1, cellPx - 2, cellPx - 2);
      }
      ctx.restore();
    }
    // surbrillance du survol
    if (S.hover && S.mode !== 'home') {
      ctx.strokeStyle = 'rgba(242,240,228,0.55)';
      ctx.lineWidth = 1.5 / z;
      if (S.stamp && S.mode === 'sandbox') {
        const pc = stampCells();
        ctx.fillStyle = 'rgba(242,240,228,0.35)';
        for (const [sx, sy] of pc) {
          if (sx >= 0 && sy >= 0 && sx < g.w && sy < g.h) {
            ctx.fillRect(sx * cellPx + 1, sy * cellPx + 1, cellPx - 2, cellPx - 2);
          }
        }
      } else {
        ctx.strokeRect(S.hover[0] * cellPx + 1, S.hover[1] * cellPx + 1, cellPx - 2, cellPx - 2);
      }
    }
    // éclair de cloche (repère écran)
    if (S.bellFlash > 0) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const a = S.bellFlash;
      ctx.fillStyle = 'rgba(242,240,228,' + (0.35 * a).toFixed(3) + ')';
      ctx.fillRect(0, 0, cssW, cssH);
      S.bellFlash = Math.max(0, a - dt * 1.4);
    }
  }

  // ---------------------------------------------------------------- génération
  const CH_SPEED = 10; // gén./s en défi

  function doGen() {
    const g = S.grid;
    const before = g.cells.slice(); // step() mute cells en place
    const res = Life.step(g);
    S.popHist.push(Life.population(g));
    if (S.popHist.length > 220) S.popHist.shift();
    // effets : échantillonne au plus ~80 événements par gén.
    let ev = 0;
    for (let i = 0; i < g.cells.length && ev < 60; i++) {
      if (g.cells[i] && !before[i]) { spawnDust(i % g.w, (i / g.w) | 0, 'birth'); ev++; }
      else if (!g.cells[i] && before[i]) { pushGhost(i % g.w, (i / g.w) | 0); spawnDust(i % g.w, (i / g.w) | 0, 'death'); ev++; }
    }
    // détection de cycle (atelier)
    if (S.mode === 'sandbox' && g.gen > 4) {
      const cyc = Life.detectCycle(g);
      S.cycleInfo = cyc ? cyc.period : null;
    }
    updateHud();
    drawSpark();
    if (S.mode === 'challenge') challengeTick();
  }

  function pushGhost(x, y) {
    GHOSTS.push({ x: x, y: y, t0: performance.now() });
    if (GHOSTS.length > 900) GHOSTS.splice(0, GHOSTS.length - 900);
  }

  function spawnDust(x, y, kind) {
    if (DUST.length > 420) return;
    const n = kind === 'birth' ? 2 : 3;
    for (let i = 0; i < n; i++) {
      DUST.push({
        x: x * cellPx + cellPx / 2 + (Math.random() - 0.5) * cellPx,
        y: y * cellPx + cellPx / 2 + (Math.random() - 0.5) * cellPx,
        vx: (Math.random() - 0.5) * 14,
        vy: -4 - Math.random() * 12,
        s: 1 + Math.random() * 1.6,
        life: 0.5 + Math.random() * 0.5,
        t0life: 1,
        rgb: kind === 'birth' ? '246,244,232' : '168,178,168'
      });
    }
  }

  function drawSpark() {
    const W = sparkC.width, H = sparkC.height;
    sparkX.clearRect(0, 0, W, H);
    sparkX.fillStyle = 'rgba(47,74,63,0.15)';
    sparkX.fillRect(0, 0, W, H);
    const h = S.popHist;
    if (h.length < 2) return;
    const max = Math.max.apply(null, h.concat([1]));
    sparkX.strokeStyle = 'rgba(47,74,63,0.85)';
    sparkX.lineWidth = 1.5;
    sparkX.beginPath();
    for (let i = 0; i < h.length; i++) {
      const px = W - (h.length - 1 - i) * (W / 219);
      const py = H - 2 - (h[i] / max) * (H - 5);
      if (i === 0) sparkX.moveTo(px, py); else sparkX.lineTo(px, py);
    }
    sparkX.stroke();
  }

  // ---------------------------------------------------------------- défis
  function level() { return Levels.LEVELS[S.levelIx]; }

  function startChallenge(ix) {
    S.mode = 'challenge';
    S.levelIx = clamp(ix, 0, Levels.LEVELS.length - 1);
    const L = level();
    S.grid = Life.makeGrid(L.w, L.h, L.seed);
    S.grid.wrap = false;
    S.baseSeed = L.seed;
    S.phase = 'setup';
    S.running = false;
    S.strokes = 0;
    S.hintUsed = false;
    S.hintCells = null;
    S.placed = Life.population(S.grid);
    S.popHist = [S.placed];
    S.cycleInfo = null;
    S.tool = L.type === 'extinct' ? 'erase' : 'draw';
    S.stamp = null;
    GHOSTS.length = 0; DUST.length = 0;
    showScreen('game');
    $('tray-challenge').classList.remove('hidden');
    $('tray-sandbox').classList.add('hidden');
    $('patternbar').classList.add('hidden');
    $('sb-hint').style.display = 'none';
    layout();
    refreshTexts();
    updateHud();
    drawSpark();
  }

  function restartChallenge() {
    startChallenge(S.levelIx);
    toast(t('setup'));
  }

  function challengeTick() {
    const L = level();
    const pop = Life.population(S.grid);
    // extinction : réussie dès que le tableau est vide
    if (L.type === 'extinct' && pop === 0) { finish(true, pop); return; }
    // la cloche
    if (S.grid.gen >= L.bell) {
      if (L.type === 'target') finish(pop === L.need, pop);
      else if (L.type === 'rescue') finish(pop >= L.need, pop);
      else finish(pop >= L.stars.s1, pop); // growth : les étoiles se règlent après
    }
  }

  function starsFor(L, pop) {
    if (L.type === 'growth') {
      if (pop >= L.stars.s3) return 3;
      if (pop >= L.stars.s2) return 2;
      if (pop >= L.stars.s1) return 1;
      return 0;
    }
    const u = S.strokes;
    if (u <= L.par.t3) return 3;
    if (u <= L.par.t2) return 2;
    return 1;
  }

  function finish(won, pop) {
    S.running = false;
    S.phase = 'done';
    const L = level();
    S.bellFlash = 1;
    Sfx.bell();
    let stars = 0;
    if (won) {
      stars = starsFor(L, pop);
      if (S.hintUsed) stars = Math.max(1, stars - 1);
      const pr = store.get('ardoise-progress', { stars: {} });
      pr.stars = pr.stars || {};
      const prev = pr.stars[L.id] || 0;
      if (stars > prev) pr.stars[L.id] = stars;
      store.set('ardoise-progress', pr);
      Sfx.win();
    } else {
      Sfx.fail();
    }
    setTimeout(function () { showResult(won, stars, pop); }, 650);
    updateHud();
  }

  function showResult(won, stars, pop) {
    const L = level();
    const isLast = S.levelIx === Levels.LEVELS.length - 1;
    let html = '<h2>' + (won ? esc(t('winTitle')) : esc(t('failTitle'))) + '</h2>';
    if (won) {
      html += '<div class="stars">' +
        '<span>' + (stars >= 1 ? '★' : '<span class="off">★</span>') + '</span>' +
        '<span>' + (stars >= 2 ? '★' : '<span class="off">★</span>') + '</span>' +
        '<span>' + (stars >= 3 ? '★' : '<span class="off">★</span>') + '</span></div>';
      if (L.type === 'target') html += '<p>' + esc(t('winTarget', { n: L.need })) + '</p>';
      if (L.type === 'rescue') html += '<p>' + esc(t('winRescue', { n: pop })) + '</p>';
      if (L.type === 'extinct') html += '<p>' + esc(t('winExtinct', { g: S.grid.gen })) + '</p>';
      if (L.type === 'growth') html += '<p>' + esc(t('bestPop', { n: pop })) + '</p>';
      if (L.type !== 'growth') html += '<p class="mono">' + esc(t(S.strokes === 1 ? 'usedStroke' : 'usedStrokes', { n: S.strokes })) + (S.hintUsed ? ' · ' + esc(t('hintUsed')) : '') + '</p>';
      else if (S.hintUsed) html += '<p class="mono">' + esc(t('hintUsed')) + '</p>';
      if (isLast) html += '<p>' + esc(t('allDone')) + '</p>';
    } else {
      html += '<p>' + esc(t('failBody')) + '</p>';
      html += '<p class="mono">' + esc(t('bestPop', { n: pop })) + '</p>';
    }
    html += '<div class="row">';
    html += '<button id="ov-menu">' + esc(t('backMenu')) + '</button>';
    html += '<button id="ov-again">' + esc(t('again')) + '</button>';
    if (won && !isLast) html += '<button id="ov-next" class="primary">' + esc(t('next')) + '</button>';
    html += '</div>';
    openOverlay(html);
    const mn = $('ov-menu'), ag = $('ov-again'), nx = $('ov-next');
    if (mn) mn.onclick = function () { closeOverlay(); goHome(); };
    if (ag) ag.onclick = function () { closeOverlay(); startChallenge(S.levelIx); };
    if (nx) nx.onclick = function () { closeOverlay(); startChallenge(S.levelIx + 1); };
  }

  // ---------------------------------------------------------------- interactions défi
  function tapCell(x, y) {
    if (S.mode === 'home') return;
    const g = S.grid;
    if (!Life.inBounds(g, x, y)) return;
    const L = S.mode === 'challenge' ? level() : null;

    if (S.stamp && S.mode === 'sandbox') { stampAt(x, y); return; }

    if (S.mode === 'challenge') {
      if (S.phase === 'done') return;
      if (S.running) { toast(t('noEditRun')); return; }
      if (L.type === 'growth' && S.phase !== 'setup') { toast(t('noEditRun')); return; }
      const alive = g.cells[y * g.w + x];
      if (L.type === 'rescue' && alive) { toast(t('drawOnly')); return; }
      if (L.type === 'extinct' && !alive) { toast(t('eraseOnly')); return; }
      if (L.type !== 'growth') {
        if (S.strokes >= L.K) { toast(t('noChalk')); return; }
      } else {
        // croissance : pose/retrait libre dans la zone, nombre final = budget
        if (L.zone) {
          const z = L.zone;
          if (x < z.x || y < z.y || x >= z.x + z.w || y >= z.y + z.h) { toast(t('zoneOnly')); return; }
        }
      }
      const changed = Life.setCell(g, x, y, alive ? 0 : 1);
      if (!changed) return;
      if (L.type !== 'growth') S.strokes++;
      S.placed = Life.population(g);
      if (alive) { pushGhost(x, y); Sfx.sponge(); } else { Sfx.chalk(); }
      if (S.phase === 'run') { S.popHist = [Life.population(g)]; }
      updateHud();
      return;
    }

    // atelier : dessin/éponge libre
    const alive = g.cells[y * g.w + x];
    const want = S.tool === 'draw' ? 1 : 0;
    if (Life.setCell(g, x, y, want)) {
      if (want === 0 && alive) { pushGhost(x, y); Sfx.sponge(); }
      else if (want === 1) Sfx.chalk();
      S.popHist = [Life.population(g)];
      S.cycleInfo = null;
      updateHud();
    }
  }

  // ---------------------------------------------------------------- atelier
  function startSandbox() {
    S.mode = 'sandbox';
    const mobile = Math.min(window.innerWidth, window.innerHeight) < 640;
    const cols = mobile ? 208 : 288, rows = mobile ? 136 : 184; // grand tableau
    S.grid = Life.makeGrid(cols, rows, []);
    S.grid.wrap = true;
    S.phase = 'run';
    S.running = false;
    S.tool = 'draw';
    S.stamp = null;
    S.stampRot = 0;
    S.popHist = [0];
    S.cycleInfo = null;
    S.hover = null;
    POINTERS.clear();
    GHOSTS.length = 0; DUST.length = 0;
    showScreen('game');
    $('tray-challenge').classList.add('hidden');
    $('tray-sandbox').classList.remove('hidden');
    $('patternbar').classList.remove('hidden');
    $('sb-hint').style.display = '';
    layout();
    centerView();
    buildPatternBar();
    refreshTexts();
    updateHud();
  }

  function stampCells() {
    const p = Life.PATTERNS[S.stamp];
    if (!p) return [];
    let cells = p.cells.map(function (c) { return [c[0], c[1]]; });
    for (let r = 0; r < S.stampRot; r++) cells = Life.rotateCells(cells);
    return cells.map(function (c) { return [S.hover ? S.hover[0] + c[0] : 0, S.hover ? S.hover[1] + c[1] : 0]; });
  }

  function stampAt(x, y) {
    const p = Life.PATTERNS[S.stamp];
    if (!p) return;
    let cells = p.cells.slice();
    for (let r = 0; r < S.stampRot; r++) cells = Life.rotateCells(cells);
    for (const c of cells) Life.setCell(S.grid, x + c[0], y + c[1], 1);
    S.popHist = [Life.population(S.grid)];
    S.cycleInfo = null;
    Sfx.stamp();
    updateHud();
  }

  function updateHud() {
    const L = S.mode === 'challenge' ? level() : null;

      $('chip-level').textContent = t('level', { n: L.id, total: Levels.LEVELS.length });
      $('chip-type').textContent = t('type' + L.type.charAt(0).toUpperCase() + L.type.slice(1));
      $('chip-gen').textContent = t('gen', { n: S.grid.gen });
      const left = L.bell - S.grid.gen;
      $('chip-bell').textContent = S.grid.gen >= L.bell ? t('bellNow') : t('bellIn', { n: Math.max(0, left) });
      $('chip-pop').textContent = t('pop', { n: pop });
      if (L.type === 'growth') {
        $('chip-budget').textContent = t('placed', { n: S.placed, b: L.budget });
      } else {
        $('chip-budget').textContent = t('budget', { left: Math.max(0, L.K - S.strokes) });

      $('chip-status').textContent = S.running ? t('running') : (S.phase === 'setup' ? t('setup') : t('paused'));

  let demoGrid = null;

  // ---------------------------------------------------------------- pointeur
  const POINTERS = new Map();  // pointerId → {x, y} (repère canvas)
  let painting = false;

  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    let sx = e.clientX - r.left, sy = e.clientY - r.top;
    if (viewActive()) {
      // écran → monde
      sx = VIEW.camX + sx / VIEW.zoom;
      sy = VIEW.camY + sy / VIEW.zoom;
    }
    return [Math.floor(sx / cellPx), Math.floor(sy / cellPx)];
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    Sfx.unlock();
    if (overlayOpen) return;
    const r = canvas.getBoundingClientRect();
    POINTERS.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top });
    canvas.setPointerCapture(e.pointerId);
    if (POINTERS.size >= 2) { painting = false; return; } // pincement à deux doigts
    painting = true;
    const [x, y] = canvasPos(e);
    S.hover = [x, y];
    if (S.stamp && S.mode === 'sandbox') stampAt(x, y);
    else if (S.tool !== 'pan') tapCell(x, y);
  });

  canvas.addEventListener('pointermove', function (e) {
    const r = canvas.getBoundingClientRect();
    const cur = { x: e.clientX - r.left, y: e.clientY - r.top };
    if (POINTERS.has(e.pointerId)) {
      const prev = POINTERS.get(e.pointerId);
      // pincement : zoom + déplacement simultanés
      if (POINTERS.size === 2 && viewActive()) {
        POINTERS.set(e.pointerId, cur);
        const pts = [...POINTERS.values()];
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        if (S.pinch) {
          const f = d / S.pinch.d;
          zoomAt(S.pinch.mid.x, S.pinch.mid.y, f);
          VIEW.camX -= (mid.x - S.pinch.mid.x) / VIEW.zoom;
          VIEW.camY -= (mid.y - S.pinch.mid.y) / VIEW.zoom;
          clampView();
        }
        S.pinch = { d: d, mid: mid };
        return;
      }
      // pan à un doigt avec l'outil Main
      if (S.tool === 'pan' && viewActive() && painting) {
        VIEW.camX -= (cur.x - prev.x) / VIEW.zoom;
        VIEW.camY -= (cur.y - prev.y) / VIEW.zoom;
        clampView();
        POINTERS.set(e.pointerId, cur);
        return;
      }
      POINTERS.set(e.pointerId, cur);
    }
    const [x, y] = canvasPos(e);
    S.hover = [x, y];
    if (!painting) return;
    if (S.tool === 'pan') return;
    if (S.stamp && S.mode === 'sandbox') return; // tampon : un clic = une pose
    // peinture continue : n'agit que si la cellule cible change d'état
    const g = S.grid;
    if (!g || !Life.inBounds(g, x, y)) return;
    if (S.mode === 'sandbox') {
      const want = S.tool === 'draw' ? 1 : 0;
      if (Life.setCell(g, x, y, want)) {
        if (want === 0) Sfx.sponge(); else Sfx.chalk();
        S.popHist = [Life.population(g)];
        updateHud();
      }
    } else if (S.phase !== 'done') {
      // en défi : le glissement appose l'outil (chaque changement coûte)
      const alive = g.cells[y * g.w + x];
      const wantChalk = S.tool === 'draw';
      if (wantChalk && alive) return;
      if (!wantChalk && !alive) return;
      tapCell(x, y);
    }
  });

  function endPaint(e) {
    POINTERS.delete(e.pointerId);
    if (POINTERS.size < 2) S.pinch = null;
    if (POINTERS.size === 0) painting = false;
  }
  canvas.addEventListener('pointerup', endPaint);
  canvas.addEventListener('pointercancel', endPaint);
  canvas.addEventListener('pointerleave', function () { S.hover = null; });

  // molette : zoom autour du curseur (atelier)
  canvas.addEventListener('wheel', function (e) {
    if (!viewActive()) return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016));
  }, { passive: false });

  // ---------------------------------------------------------------- clavier
  document.addEventListener('keydown', function (e) {
    if (overlayOpen) return;
    if (e.target && e.target.tagName === 'BUTTON') return; // le bouton focalisé garde Espace
    if (e.code === 'Space') {
      e.preventDefault();
      toggleRun();
    } else if (e.key === 's' || e.key === 'S') {
      if (S.mode !== 'home' && !S.running) doStep();
    } else if (e.key === 'r' || e.key === 'R') {
      if (S.mode === 'sandbox' && S.stamp) {
        S.stampRot = (S.stampRot + 1) % 4;
        toast(t('pat_' + S.stamp) + ' ↻');
      } else if (S.mode === 'challenge') {
        restartChallenge();
      }
    }
  });

  function toggleRun() {
    if (S.mode === 'challenge') {
      const L = level();
      if (S.phase === 'done') return;
      if (!S.running && L.type === 'growth' && S.placed !== L.budget) {
        toast(t('growthNeed', { b: L.budget }));
        return;
      }
      S.running = !S.running;
      if (S.running && S.phase === 'setup') S.phase = 'run';
      Sfx.tick();
      updateHud();
    } else if (S.mode === 'sandbox') {
      S.running = !S.running;
      Sfx.tick();
      updateHud();
    }
  }

  }

      b.onclick = function () {
        I18N.setLang(code);
        buildLangs();
        refreshTexts();
        if (S.mode === 'sandbox') buildPatternBar();
      };
      box.appendChild(b);
    });
  }

  // titre : chaque lettre légèrement tournée (lettrage à la craie)
  function chalkTitle() {
    const el = $('title');
    const word = 'ARDOISE';
    el.innerHTML = '';
    for (let i = 0; i < word.length; i++) {
      const sp = document.createElement('span');
      sp.className = 'lt';
      sp.textContent = word[i];
      sp.style.transform = 'rotate(' + (((i * 37) % 9) - 4) + 'deg) translateY(' + (((i * 53) % 5) - 2) + 'px)';
      el.appendChild(sp);
    }
  }

  // ---------------------------------------------------------------- démarrage
  window.addEventListener('resize', function () {
    if (S.mode !== 'home') layout();
  });

  document.addEventListener('pointerdown', function once() {
    Sfx.unlock();
  }, { once: true });

  chalkTitle();
  buildLangs();
  I18N.setLang(I18N.lang);
  refreshTexts();
  showScreen('home');
  requestAnimationFrame(frame);

  // ---------------------------------------------------------------- hook de test
  if (DEBUG) {
    window.__ardoise = {
      S: S,
      start: startChallenge,
      sandbox: startSandbox,
      step: function (n) { for (let i = 0; i < (n || 1); i++) doGen(); return { gen: S.grid.gen, pop: Life.population(S.grid) }; },
      tap: function (x, y) { tapCell(x, y); },
      run: function () { S.running = true; },
      stop: function () { S.running = false; },
      ref: function () { const L = level(); for (const c of L.ref) tapCell(c[0], c[1]); },
      levels: function () { return Levels.LEVELS; },
      layout: layout,
      view: VIEW,
      zoomAt: zoomAt,
      centerView: centerView,
      progress: function () { return store.get('ardoise-progress', { stars: {} }); }
    };
  }
})();

</script>
</body>
</html>
